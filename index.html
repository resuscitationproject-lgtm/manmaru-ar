<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8e8" />
    <title>まんまる文化祭 ARスタンプラリー</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">MANMARU CULTURE FESTIVAL</p>
          <h1>まんまる文化祭</h1>
        </div>
        <div class="badge">AR<br />01</div>
      </header>

      <section class="intro-card" aria-labelledby="page-title">
        <div class="intro-copy">
          <span class="step-label">STEP 1</span>
          <h2 id="page-title">マークを見つけて<br /><em>まるぽん</em>を呼ぼう！</h2>
          <p>会場のARマークにカメラを向けると、子どもたちのキャラクターが飛び出します。</p>
        </div>
        <div class="sparkle" aria-hidden="true">✦</div>
      </section>

      <section class="camera-card" aria-label="ARカメラ">
        <div class="camera-frame">
          <a-scene
            id="ar-scene"
            mindar-image="imageTargetSrc: assets/targets.mind; autoStart: false; uiScanning: #scanning-ui; uiLoading: #loading-ui; maxTrack: 1;"
            color-space="sRGB"
            renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false"
            embedded
          >
            <a-assets>
              <img id="marpon-image" src="assets/character-marpon.png" alt="まるぽん" crossorigin="anonymous" />
            </a-assets>
            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
            <a-entity id="target-entity" mindar-image-target="targetIndex: 0">
              <a-image id="character" src="#marpon-image" position="0 0.1 0.05" width="1.1" height="1.1" transparent="true" animation="property: scale; from: 0.1 0.1 0.1; to: 1 1 1; dur: 550; easing: easeOutElastic"></a-image>
              <a-entity id="speech-bubble" position="0.75 0.7 0.08" visible="false">
                <a-plane color="#fffdf7" width="1.7" height="0.8" material="shader: flat; transparent: true; opacity: 0.96"></a-plane>
                <a-text value="まるぽんパワー！\nきらきらビーム！" color="#442c57" align="center" width="2.8" position="0 0 0.03" font="https://cdn.aframe.io/fonts/Roboto-msdf.json"></a-text>
              </a-entity>
            </a-entity>
          </a-scene>
          <div id="loading-ui" class="camera-message"><span class="loader"></span><span>ARカメラを準備中…</span></div>
          <div id="scanning-ui" class="camera-message scanning-message"><span class="scan-corners"></span><strong>ARマークを探してね</strong><span>カメラをゆっくり動かそう</span></div>
          <div id="camera-error" class="camera-message error-message" hidden></div>
          <div class="camera-hint">TARGET 01</div>
        </div>
        <div class="status-row" aria-live="polite">
          <span id="status-dot" class="status-dot"></span>
          <span id="status-text">カメラを起動する準備ができました</span>
        </div>
        <button id="start-button" class="primary-button" type="button">カメラを起動する <span>→</span></button>
      </section>

      <section class="target-card">
        <div class="target-card-heading"><span>AR TARGET</span><span class="target-number">01</span></div>
        <div class="target-preview">
          <img src="assets/target-demo.svg" alt="会場に設置するARマークの見本" />
          <div>
            <h3>このマークを見つけよう</h3>
            <p>会場にある「まんまるAR 01」マークをカメラに映してね。</p>
          </div>
        </div>
      </section>

      <footer><span>PHASE 1 MOCKUP</span><span>LOCAL DATA ONLY</span></footer>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
