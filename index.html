<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ff7a59" />
    <meta name="description" content="まんまる文化祭 ARスタンプラリー Phase 1" />
    <title>まんまる文化祭 ARスタンプラリー</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <main id="app" class="app-shell">
      <section id="welcome" class="welcome panel" aria-labelledby="event-title">
        <p class="eyebrow">スマホで見つける、会場のひみつ</p>
        <img id="welcome-character" class="welcome-character" alt="イベントキャラクター" />
        <h1 id="event-title"><span class="title-line">まんまる文化祭</span><span class="title-line">ARスタンプラリー</span></h1>
        <p id="event-description" class="lead">会場のマークにカメラを向けよう！</p>
        <div class="steps" aria-label="遊び方">
          <span><b>1</b> カメラを起動</span>
          <span><b>2</b> マークを発見</span>
          <span><b>3</b> スタンプ獲得</span>
        </div>
        <button id="start-button" class="primary-button" type="button" disabled>準備中…</button>
        <p class="privacy-note">カメラ映像は端末内で処理され、保存・送信されません。</p>
      </section>

      <section id="ar-view" class="ar-view" aria-label="ARカメラ" hidden>
        <div id="ar-container"></div>
        <header class="top-bar">
          <div>
            <p id="event-name-small" class="event-name-small"></p>
            <p id="progress-label" class="progress-label">スタンプ 0 / 1</p>
          </div>
          <button id="close-button" class="icon-button" type="button" aria-label="カメラを閉じる">×</button>
        </header>

        <div id="guide" class="guide" role="status" aria-live="polite">
          <div class="scan-frame" aria-hidden="true"></div>
          <p id="guide-message">会場のマークを枠の中に入れてね</p>
        </div>

        <section id="stamp-card" class="stamp-card" aria-live="polite" hidden>
          <p id="discovery-message" class="discovery-message">キャラクターを発見！</p>
          <button id="stamp-button" class="primary-button stamp-button" type="button">スタンプを貯める</button>
        </section>

        <section id="success-card" class="success-card panel" aria-live="assertive" hidden>
          <div class="stamp-seal">GET!</div>
          <p class="eyebrow">スタンプ獲得</p>
          <h2 id="success-title">やったね！</h2>
          <p id="success-message"></p>
          <button id="continue-button" class="secondary-button" type="button">カメラにもどる</button>
        </section>
      </section>

      <section id="error-card" class="error-card panel" role="alert" hidden>
        <h2>カメラを起動できませんでした</h2>
        <p id="error-message">通信環境とカメラの許可を確認して、もう一度お試しください。</p>
        <button id="retry-button" class="primary-button" type="button">もう一度試す</button>
      </section>
    </main>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
