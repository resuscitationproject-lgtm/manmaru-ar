<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fffaf1" />
    <meta name="description" content="ARスタンプラリーの達成画面。受付でスタッフにお見せください。" />
    <title>達成状況を確認中</title>
    <link rel="stylesheet" href="./styles.css?v=20261116-1" />
  </head>
  <body>
    <main class="completion-shell">
      <p id="completion-loading" class="completion-loading" role="status">達成状況を確認しています…</p>
      <section id="completion-card" class="completion-panel panel" aria-labelledby="completion-title" hidden>
        <p id="completion-event" class="eyebrow"></p>
        <div class="completion-seal" aria-hidden="true">✓</div>
        <p class="eyebrow">全スタンプ達成</p>
        <h1 id="completion-title">コンプリート！</h1>
        <p id="completion-count" class="completion-count"></p>
        <p id="completion-message" class="completion-message"></p>
        <ul id="completion-stamps" class="completion-stamps" aria-label="獲得したスタンプ"></ul>
        <p class="completion-note">受付でこの画面をお見せください。<br />同じブラウザでアプリを開くと、もう一度表示できます。</p>
        <details class="completion-settings">
          <summary>スタンプの管理</summary>
          <button id="completion-reset" class="reset-button" type="button">スタンプをリセット</button>
        </details>
      </section>
      <section id="completion-error" class="completion-panel panel" role="alert" hidden>
        <h2>達成状況を確認できませんでした</h2>
        <p>通信環境を確認して、もう一度お試しください。</p>
        <button id="completion-retry" class="secondary-button" type="button">もう一度確認する</button>
      </section>
    </main>
    <script type="module" src="./js/complete-page.js?v=20261116-1"></script>
  </body>
</html>
